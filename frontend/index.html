<!doctype html>
<html lang="es" data-diseno="3g">
  <head>
    <meta charset="UTF-8" />
    <!-- Diseño 3G · SOLO EL DISEÑO NUEVO (decisión del dueño, 16-oct-2026): todos ven el rediseño 2 y ya no hay interruptor.
         <html data-diseno="3g"> va fijo y este guion lo vuelve a poner antes de cualquier CSS (sin parpadeo de lo viejo).
         - ?diseno=actual o ?diseno=3g ya no cambian nada: se quitan de la dirección (sin tocar history.state) antes de que
           cargue el paquete, para que diseno-3g.js no guarde nada al leerlos.
         - Lo guardado en el navegador (localStorage['diseno-3g']) NO se toca: si hubiera que regresar a la versión de antes,
           cada quien ve lo que veía. Un «actual» guardado lo corrige forzarDiseno3G.js al cargar el paquete.
         - El tema claro/oscuro/auto se sigue respetando (localStorage['diseno-3g-tema']).
         - Ya no hay rutas sin diseño: TV, terminal, anuncios y calendario público también llevan el rediseño
           (window.G3_RUTAS_SIN_DISENO se quitó). Ver src/diseno-3g/LEEME.md («Solo el diseño nuevo»).
         VIEJO: se borra a partir del 24-oct-2026 — la regla de abajo solo servía con el diseño apagado. -->
    <!-- TV clásica (19-oct-2026): /produccion-tv, /preparados-tv, /manufactura-tv, /herreria-tv y /calendario-publico van SIN
         data-diseno (como antes del Diseño 3G); misma lista en src/tv-clasico/rutasTvClasica.js. -->
    <style>:root:not([data-diseno='3g']) .g3-si{display:none!important}</style>
    <script>(function(d,k){if(/^\/(produccion|preparados|manufactura|herreria)-tv\/?$|^\/calendario-publico\/?$/.test(location.pathname)){d.removeAttribute('data-diseno');return}d.setAttribute('data-diseno','3g');try{var u=new URL(location.href);if(u.searchParams.has('diseno')){u.searchParams.delete('diseno');history.replaceState(history.state,'',u.pathname+u.search+u.hash)}}catch(e){}try{var t=localStorage.getItem(k+'-tema');if(/^(auto|claro|oscuro)$/.test(t))d.setAttribute('data-g3-tema',t)}catch(e){}})(document.documentElement,'diseno-3g')</script>
    <!-- Rediseño 2 · pantallas de piso: ya no se pone data-g3-tv (el diseño de TV de la ola 3 no se usa). Solo se anota ?tema=claro|oscuro
         de ESTA carga para useTemaPiso() (src/rediseno2/fundacion/piso/usePiso.js). -->
    <script>(function(d){try{if(d.getAttribute('data-diseno')!=='3g')return;var t=new URLSearchParams(location.search).get('tema');if(t==='claro'||t==='oscuro')window.G3_TEMA_PISO=t}catch(e){}})(document.documentElement)</script>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dd93jrilg/image/upload/v1762289946/logo-page_qhpoey.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inventario 3G" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dd93jrilg/image/upload/v1762289946/logo-page_qhpoey.png" />

    <!-- Theme color para navegadores móviles -->
    <meta name="theme-color" content="#dc2626" />
    <meta name="msapplication-TileColor" content="#dc2626" />

    <!-- Descripción para PWA -->
    <meta name="description" content="Sistema de Inventario 3G - Gestión de inventario, pedidos y órdenes de compra" />

    <title>Inventario 3G</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
